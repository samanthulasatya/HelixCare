version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: helixcare-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - helixcare-network

  gateway-service:
    image: ${DOCKERHUB_USERNAME:-satyasamanthula}/gateway-service:latest
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysql-db
    networks:
      - helixcare-network

  patient-service:
    image: ${DOCKERHUB_USERNAME:-satyasamanthula}/patient-service:latest
    container_name: patient-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysql-db
    networks:
      - helixcare-network

  doctor-service:
    image: ${DOCKERHUB_USERNAME:-satyasamanthula}/doctor-service:latest
    container_name: doctor-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysql-db
    networks:
      - helixcare-network

  appointment-service:
    image: ${DOCKERHUB_USERNAME:-satyasamanthula}/appointment-service:latest
    container_name: appointment-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysql-db
    networks:
      - helixcare-network

  billing-service:
    image: ${DOCKERHUB_USERNAME:-satyasamanthula}/billing-service:latest
    container_name: billing-service
    ports:
      - "8088:8088"
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysql-db
    networks:
      - helixcare-network

  frontend:
    image: ${DOCKERHUB_USERNAME:-satyasamanthula}/frontend:latest
    container_name: frontend-client
    ports:
      - "80:80"
    depends_on:
      - gateway-service
    networks:
      - helixcare-network

volumes:
  mysql-data:

networks:
  helixcare-network:
    driver: bridge
